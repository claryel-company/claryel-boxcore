name: Bootstrap repository to CLARYEL01 LAN primary
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  promote-self:
    runs-on: [self-hosted, linux, x64, claryel-privileged]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote exact snapshot to LAN primary
        shell: bash
        env:
          HOST_IMAGE: ubuntu:24.04
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(hostname -s)" = claryel01
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker info >/dev/null
          name="${GITHUB_REPOSITORY#*/}"
          primary="/home/viktor/CLARYEL/git-primary/$name.git"
          canonical="/srv/claryel/src/$name"
          bundle="$RUNNER_TEMP/$name.bundle"
          host_exec(){ docker run --rm --privileged --pid=host --volume /:/host "$HOST_IMAGE" chroot /host /usr/bin/nsenter --target 1 --mount --uts --ipc --net --pid -- "$@"; }

          # EN: Fetch every advertised branch and tag before creating the self-contained transfer bundle.
          # RU: Получить каждую объявленную ветку и тег перед созданием автономного transfer-bundle.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git fsck --full --strict >/dev/null
          git bundle create "$bundle" --all
          git bundle verify "$bundle" >/dev/null
          local_before="$(host_exec /usr/sbin/runuser -u viktor -- /usr/bin/git --git-dir="$primary" rev-parse refs/heads/main 2>/dev/null || true)"
          if [[ -n "$local_before" ]]; then git cat-file -e "$local_before^{commit}"; git merge-base --is-ancestor "$local_before" "$GITHUB_SHA"; fi
          if host_exec /usr/bin/test -d "$canonical/.git"; then test -z "$(host_exec /usr/sbin/runuser -u viktor -- /usr/bin/git -C "$canonical" status --porcelain=v1 --untracked-files=normal)"; elif host_exec /usr/bin/test -e "$canonical"; then exit 1; fi
          group="$(host_exec /usr/bin/id -gn viktor)"
          transfer="/home/viktor/CLARYEL/.bootstrap/self-primary/$name.bundle"
          host_exec /usr/bin/install -d -o viktor -g "$group" -m 0700 /home/viktor/CLARYEL/.bootstrap/self-primary
          host_exec /usr/bin/install -o viktor -g "$group" -m 0600 "$bundle" "$transfer"

          # EN: Existing main advances only by fast-forward; a missing primary is created from the verified bundle.
          # RU: Существующий main продвигается только fast-forward; отсутствующий primary создаётся из проверенного bundle.
          host_exec /usr/bin/env PRIMARY="$primary" BUNDLE="$transfer" EXPECTED="$GITHUB_SHA" BEFORE="${local_before:-none}" /usr/sbin/runuser -u viktor -- /usr/bin/bash -lc '
            set -Eeuo pipefail
            if [[ -d "$PRIMARY" ]]; then
              test "$BEFORE" != none
              git --git-dir="$PRIMARY" fetch "$BUNDLE" refs/heads/main:refs/heads/main
              git --git-dir="$PRIMARY" fetch "$BUNDLE" "+refs/remotes/origin/*:refs/remotes/github/*"
              git --git-dir="$PRIMARY" fetch "$BUNDLE" "refs/tags/*:refs/tags/*"
            else
              git clone --bare --quiet "$BUNDLE" "$PRIMARY"
              git --git-dir="$PRIMARY" remote remove origin 2>/dev/null || true
            fi
            test "$(git --git-dir="$PRIMARY" rev-parse refs/heads/main)" = "$EXPECTED"
            git --git-dir="$PRIMARY" symbolic-ref HEAD refs/heads/main
            git --git-dir="$PRIMARY" config receive.fsckObjects true
            git --git-dir="$PRIMARY" config core.logAllRefUpdates true
            git --git-dir="$PRIMARY" fsck --full --strict >/dev/null
          '
          hook="$RUNNER_TEMP/pre-receive"
          cat >"$hook" <<'HOOK'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          z=0000000000000000000000000000000000000000
          while read -r old new ref; do
            case "$ref" in
              refs/heads/main) [[ "$new" != "$z" ]] && { [[ "$old" == "$z" ]] || git merge-base --is-ancestor "$old" "$new"; } || exit 1 ;;
              refs/tags/*) [[ "$new" != "$z" && "$old" == "$z" ]] || exit 1 ;;
            esac
          done
          HOOK
          host_exec /usr/bin/install -o viktor -g "$group" -m 0755 "$hook" "$primary/hooks/pre-receive"

          # EN: Canonical development pulls and pushes through LAN primary; GitHub remains the external read origin.
          # RU: Canonical-разработка выполняет pull и push через LAN-primary; GitHub остаётся внешним read-origin.
          host_exec /usr/bin/bash -lc 'test -d /srv/claryel/src || install -d -o viktor -g "$(id -gn viktor)" -m 0755 /srv/claryel/src'
          host_exec /usr/bin/env PRIMARY="$primary" CANONICAL="$canonical" EXPECTED="$GITHUB_SHA" NAME="$name" /usr/sbin/runuser -u viktor -- /usr/bin/bash -lc '
            set -Eeuo pipefail
            [[ -d "$CANONICAL/.git" ]] || git clone --quiet "$PRIMARY" "$CANONICAL"
            test -z "$(git -C "$CANONICAL" status --porcelain=v1 --untracked-files=normal)"
            git -C "$CANONICAL" checkout -q main
            if git -C "$CANONICAL" remote get-url lan-primary >/dev/null 2>&1; then git -C "$CANONICAL" remote set-url lan-primary "$PRIMARY"; else old="$(git -C "$CANONICAL" remote get-url origin 2>/dev/null || true)"; [[ "$old" == "$PRIMARY" ]] && git -C "$CANONICAL" remote rename origin lan-primary || git -C "$CANONICAL" remote add lan-primary "$PRIMARY"; fi
            git -C "$CANONICAL" remote get-url origin >/dev/null 2>&1 && git -C "$CANONICAL" remote set-url origin "https://github.com/claryel-company/$NAME.git" || git -C "$CANONICAL" remote add origin "https://github.com/claryel-company/$NAME.git"
            git -C "$CANONICAL" remote set-url --push origin "ssh://git@127.0.0.1:1/github-write-disabled.git"
            git -C "$CANONICAL" config remote.pushDefault lan-primary
            git -C "$CANONICAL" config branch.main.remote lan-primary
            git -C "$CANONICAL" config branch.main.merge refs/heads/main
            git -C "$CANONICAL" fetch -q lan-primary main
            git -C "$CANONICAL" merge --ff-only -q lan-primary/main
            test "$(git -C "$CANONICAL" rev-parse HEAD)" = "$EXPECTED"
          '
          host_exec /usr/bin/rm -f "$transfer"
          printf 'CLARYEL_SELF_LAN_PRIMARY=accepted repository=%s main=%s fsck=accepted protected=true sites_changed=false\n' "$name" "$GITHUB_SHA"
