name: Validate project knowledge publisher

on:
  pull_request:
    paths:
      - ".github/actions/publish-project-knowledge/**"
      - ".github/workflows/publish-project-knowledge.yml"
  push:
    branches:
      - main
    paths:
      - ".github/actions/publish-project-knowledge/**"
      - ".github/workflows/publish-project-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-knowledge-${{ github.repository }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate reusable action sources
        shell: bash
        run: |
          set -Eeuo pipefail
          action=.github/actions/publish-project-knowledge/action.yml
          collector=.github/actions/publish-project-knowledge/collect.py
          synchronizer=.github/actions/publish-project-knowledge/sync_server.py
          test -s "$action"
          python3 -m py_compile "$collector" "$synchronizer"
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          action = yaml.safe_load(Path('.github/actions/publish-project-knowledge/action.yml').read_text())
          assert action['runs']['using'] == 'composite'
          assert set(action['outputs']) == {'status', 'created', 'updated', 'unchanged', 'missing', 'failed'}
          PY
          grep -Fq 'project-knowledge-publisher-v1' "$collector"
          grep -Fq 'project-knowledge-publisher-v1' "$synchronizer"
          grep -Fq 'knowledge_source_versions' "$synchronizer"
          grep -Fq 'repository_contexts' "$synchronizer"
          grep -Fq 'architecture_record_versions' "$synchronizer"
          grep -Fq 'schema_assets' "$synchronizer"
          grep -Fq 'next_steps' "$synchronizer"
          if grep -Eiq '\b(DROP|TRUNCATE)\b' "$synchronizer"; then
            printf '%s\n' 'Synchronizer contains destructive SQL.' >&2
            exit 1
          fi

      - name: Confirm delegated publication boundary
        shell: bash
        run: |
          printf '%s\n' \
            'publication_mode=delegated-to-private-fleet' \
            'private_self_hosted_runner_exposed=false' \
            'scheduled_publication_owner=claryel-company/claryel-fleet'
