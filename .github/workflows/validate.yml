name: Validate public baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate public repository
        run: python3 scripts/validate_public_baseline.py

      - name: Run Go tests with race detection
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check Nix flake
        run: nix flake check --no-build

      - name: Validate desired-state example
        run: >-
          nix run nixpkgs#check-jsonschema --
          --schemafile schemas/desired-state.schema.json
          examples/systems/home.json

      - name: Validate change-plan examples
        run: >-
          nix run nixpkgs#check-jsonschema --
          --schemafile schemas/change-plan.schema.json
          examples/change-plan-low-risk.json
          examples/change-plan-high-risk.json

      - name: Test policy
        run: nix run nixpkgs#open-policy-agent -- test policy

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete public history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks CLI
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0
          detect --source=/repo --no-banner --redact --verbose
